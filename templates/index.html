{% extends "base.html" %}
{% block title %}仪表盘 – IoT 设备管理{% endblock %}

{% block content %}
<h1>仪表盘</h1>

<div class="card-grid">
  <div class="stat-card">
    <div class="number">{{ total }}</div>
    <div class="label">全部设备</div>
  </div>
  <div class="stat-card warning">
    <div class="number">{{ pending }}</div>
    <div class="label">待分配</div>
  </div>
  <div class="stat-card success">
    <div class="number">{{ active }}</div>
    <div class="label">已激活</div>
  </div>
  <div class="stat-card danger">
    <div class="number">{{ disabled }}</div>
    <div class="label">已禁用</div>
  </div>
</div>

<div class="card">
  <h2>快速操作</h2>
  <p style="color:var(--muted); margin-bottom:1rem;">管理所有已注册的 IoT 传感器设备。</p>
  <a href="{{ url_for('device_list') }}" class="btn btn-primary">查看设备列表 →</a>
  <a href="{{ url_for('subsensor_group_list') }}" class="btn btn-outline">维护子传感器分组地址表</a>
</div>
{% endblock %}
